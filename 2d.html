<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>定時退社シミュレーター</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #0d0f12; color: #e8e6e1; overflow: hidden;
    font-family: "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif; }
  #wrap { position: relative; width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; padding: 96px 8px 56px; }
  canvas { display: block; image-rendering: auto; touch-action: none; }
  .panel { position: absolute; background: rgba(14,17,22,.88); border: 1px solid rgba(255,255,255,.08);
    border-radius: 6px; padding: 10px 14px; pointer-events: none; }
  #mission { top: 12px; left: 12px; min-width: 230px; border-left: 3px solid #e7b931; }
  #mission .who { font-size: 12px; opacity: .8; }
  #mission .title { font-size: 17px; font-weight: 800; color: #f2c94c; margin-top: 4px; }
  #mission .sub { font-size: 12px; margin-top: 3px; }
  #mission.alert { border-left-color: #e5484d; }
  #mission.alert .title { color: #ff6b6b; }
  #clock { top: 12px; right: 12px; text-align: right; min-width: 170px; }
  #clock .t { font-size: 26px; font-weight: 800; letter-spacing: .04em; }
  #clock .loc { font-size: 12px; margin-top: 2px; }
  #clock .goal { font-size: 11px; color: #f2c94c; margin-top: 2px; }
  #hint { bottom: 12px; right: 12px; font-size: 12px; }
  #status { bottom: 12px; left: 12px; font-size: 12px; }
  #status .bar { width: 160px; height: 6px; background: #2a2f37; border-radius: 3px; margin-top: 6px; overflow: hidden; }
  #status .fill { height: 100%; width: 0; background: #e7b931; transition: width .1s; }
  #dialog { left: 50%; bottom: 70px; transform: translateX(-50%); min-width: 340px; max-width: 90vw; display: none; }
  #dialog .name { font-size: 11px; color: #f2c94c; }
  #dialog .line { font-size: 18px; font-weight: 700; margin-top: 4px; }
  #overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(5,6,8,.72); }
  #overlay .box { background: rgba(14,17,22,.96); border: 1px solid rgba(255,255,255,.1); border-radius: 8px;
    padding: 28px 34px; text-align: center; max-width: 92vw; }
  #overlay h1 { font-size: 30px; font-weight: 900; color: #f2c94c; }
  #overlay h1.fail { color: #ff5a5f; }
  #overlay p { margin-top: 10px; line-height: 1.7; font-size: 14px; }
  #overlay .big { font-size: 18px; font-weight: 700; }
  #overlay button { margin-top: 18px; font: inherit; font-weight: 800; font-size: 16px; padding: 10px 26px;
    background: #f2c94c; color: #111; border: 0; border-radius: 4px; cursor: pointer; }
  #overlay button.sub { background: transparent; color: #e8e6e1; border: 1px solid rgba(255,255,255,.3); margin-left: 8px; }
  #overlay .keys { font-size: 12px; opacity: .75; margin-top: 14px; }
  #sneakBtn { position: absolute; right: 18px; bottom: 60px; width: 76px; height: 76px; border-radius: 50%;
    background: rgba(242,201,76,.18); border: 2px solid rgba(242,201,76,.6); color: #f2c94c; font-weight: 800;
    font-size: 14px; display: none; touch-action: none; }
  #sneakBtn.on { background: rgba(242,201,76,.55); color: #111; }
  @media (pointer: coarse) { #sneakBtn { display: block; } #hint { display: none; } }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="mission" class="panel">
    <div class="who">山田 ｜ 営業部</div>
    <div class="title" id="mTitle">定時退社ミッション</div>
    <div class="sub" id="mSub">上司に見つからずに会社を出る</div>
  </div>
  <div id="clock" class="panel">
    <div class="t" id="time">17:59</div>
    <div class="loc" id="loc">本社・営業フロア</div>
    <div class="goal" id="goal">目標：出口へ</div>
  </div>
  <div id="status" class="panel">
    <div id="stText">未発見</div>
    <div class="bar"><div class="fill" id="stFill"></div></div>
  </div>
  <div id="hint" class="panel">移動：WASD／矢印　しゃがむ：Shift（遅くなるが机に隠れられる）</div>
  <div id="dialog" class="panel"><div class="name" id="dName"></div><div class="line" id="dLine"></div></div>
  <button id="sneakBtn">しゃがむ</button>
  <div id="overlay"><div class="box" id="ovBox"></div></div>
</div>
<script>
'use strict';
// ===== マップ =====
// # 壁（通れない・見えない） P パーティション（通れない・見えない） D 机（通れない・しゃがめば隠れる）
// S 開始 E 出口 L エレベーター（待つと開く。ただし…）
const T = 40;
const LEVELS = [
  {
    name: '本社・営業フロア', goal: '目標：フロアの出口へ',
    map: [
      '######################',
      '#S..D..P.....D..P....#',
      '#...D..P.....D..P....#',
      '#......P..........##.#',
      '#..DD.....DDD.....#..#',
      '#.........PPP........#',
      '#..PPP...........DD..#',
      '#......DD....P.......#',
      '#..DD..DD....P..PPP..#',
      '#....................#',
      '#..P...DDD....P......#',
      '#..P..........P.....E#',
      '######################',
    ],
    bosses: [
      { name: '課長', color: '#c0392b', speed: 52, path: [[9,3,1.5],[9,9,1.2],[15,9,1.5],[15,3,1.2]],
        lines: ['山田くん、あとでちょっといい？', '帰る前にさ、例の件どうなった？'] },
      { name: '係長', color: '#d35400', speed: 48, path: [[2,9,1.8],[11,9,1.8]],
        lines: ['あ、山田さん。明日の資料ってもうできてます？', 'ちょっとだけ相談いいですか？'] },
    ],
  },
  {
    name: 'エレベーターホール', goal: '目標：エレベーター or 非常階段',
    map: [
      '######################',
      '#S......#.....#LLL####',
      '#.......#.....#......#',
      '#..PP...#............#',
      '#..PP.........PP.....#',
      '#.........#...PP.....#',
      '#####..####..........#',
      '#.........#....DD....#',
      '#..DD.....#....DD....#',
      '#..DD................#',
      '#.........#........P.#',
      '#.........#........PE#',
      '######################',
    ],
    bosses: [
      { name: '部長', color: '#8e44ad', speed: 46, path: [[13,3,2.0],[13,9,1.0],[19,9,1.5],[19,3,1.5]],
        lines: ['山田くん、この資料だけ見てくれる？5分で終わるから。', 'お、ちょうどいいところに。'] },
      { name: '課長', color: '#c0392b', speed: 50, path: [[5,7,1.5],[9,7,1.0],[9,10,1.5],[5,10,1.0]],
        lines: ['山田くん、あとでちょっといい？', '今日このあと時間ある？'] },
    ],
    elevator: { wait: 3.2, risk: 0.45 },
  },
  {
    name: '1F ロビー', goal: '目標：正面玄関から外へ',
    map: [
      '######################',
      '#S...#...........#...#',
      '#....#...DDDD....#...#',
      '#....#...........#...#',
      '#....P....PP.....P...#',
      '#.........PP.........#',
      '#..DD................#',
      '#..DD....P...P...DD..#',
      '#........P...P...DD..#',
      '#....................#',
      '#..PP.....DDDD.....#.#',
      '#..................#E#',
      '######################',
    ],
    bosses: [
      { name: '社長', color: '#2c3e50', speed: 44, path: [[7,3,2.0],[15,3,2.0],[15,9,1.5],[7,9,1.5]],
        lines: ['君、営業部の…山田くんだったかな。少し話そうか。', '若いのに感心だね。ところで来週の件だが。'] },
      { name: '部長', color: '#8e44ad', speed: 48, path: [[19,2,1.2],[19,9,1.2]],
        lines: ['あれ、山田くんもう帰り？ちょうどよかった。', '5分だけ。ほんとに5分だけだから。'] },
      { name: '課長', color: '#c0392b', speed: 52, path: [[1,9,1.0],[1,5,1.0],[8,5,1.0],[8,9,1.0]],
        lines: ['山田くん、あとでちょっといい？'] },
    ],
  },
];

const ELEVATOR_LINE = { name: '部長', line: '（扉が開くと、部長が乗っていた）「お、山田くん。ちょうど話があったんだ」' };
const FAIL_TEXTS = [
  ['「5分だけ」から1時間経過', '追加クエスト：終わらない残業'],
  ['「ちょっとだけ」が会議になった', '追加クエスト：議事録作成'],
  ['気づけば終電の時間', '追加クエスト：明日の資料'],
];

// ===== 状態 =====
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const $ = id => document.getElementById(id);
let W, H, scale = 1;
let level = 0, state = 'title'; // title | play | caught | clear | allclear
let grid, player, bosses, meter, gameSec, elevT, caughtBy, dialogTimer, totalStart;
const keys = {};
let sneakToggle = false;
const joy = { active: false, id: null, sx: 0, sy: 0, dx: 0, dy: 0 };

function loadLevel(i) {
  const L = LEVELS[i];
  grid = L.map.map(r => r.split(''));
  W = grid[0].length * T; H = grid.length * T;
  cv.width = W; cv.height = H;
  resize();
  for (let y = 0; y < grid.length; y++) for (let x = 0; x < grid[0].length; x++) {
    if (grid[y][x] === 'S') { player = { x: x * T + T / 2, y: y * T + T / 2, r: 11, face: 0 }; grid[y][x] = '.'; }
  }
  bosses = L.bosses.map(b => ({
    ...b, x: b.path[0][0] * T + T / 2, y: b.path[0][1] * T + T / 2, wp: 1 % b.path.length,
    wait: b.path[0][2], ang: 0, baseAng: 0, look: 0, sus: 0, fov: Math.PI * 0.42, range: T * 5.2,
  }));
  bosses.forEach(b => { const n = b.path[b.wp]; b.ang = b.baseAng = Math.atan2(n[1] * T + T/2 - b.y, n[0] * T + T/2 - b.x); });
  meter = 0; elevT = 0; caughtBy = null;
  $('loc').textContent = L.name; $('goal').textContent = L.goal;
  setMission(false);
}

function resize() {
  if (!W) return;
  scale = Math.min((window.innerWidth - 16) / W, (window.innerHeight - 152) / H);
  cv.style.width = W * scale + 'px'; cv.style.height = H * scale + 'px';
}
window.addEventListener('resize', resize);

// ===== タイル判定 =====
const tile = (px, py) => {
  const x = Math.floor(px / T), y = Math.floor(py / T);
  if (y < 0 || y >= grid.length || x < 0 || x >= grid[0].length) return '#';
  return grid[y][x];
};
const solid = c => c === '#' || c === 'P' || c === 'D';
const blocksSight = (c, low) => c === '#' || c === 'P' || (low && c === 'D');

function collides(x, y, r) {
  for (const [ox, oy] of [[-r,-r],[r,-r],[-r,r],[r,r],[0,-r],[0,r],[-r,0],[r,0]])
    if (solid(tile(x + ox, y + oy))) return true;
  return false;
}
function los(x0, y0, x1, y1, low) {
  const d = Math.hypot(x1 - x0, y1 - y0), n = Math.ceil(d / 5);
  for (let i = 1; i < n; i++) {
    const t = i / n;
    if (blocksSight(tile(x0 + (x1 - x0) * t, y0 + (y1 - y0) * t), low)) return false;
  }
  return true;
}
const angDiff = (a, b) => { let d = a - b; while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI; return d; };

// ===== 入力 =====
addEventListener('keydown', e => {
  keys[e.key.toLowerCase()] = true;
  if (['arrowup','arrowdown','arrowleft','arrowright',' '].includes(e.key.toLowerCase())) e.preventDefault();
  if ((e.key === 'Enter' || e.key === ' ') && state !== 'play') { const b = document.querySelector('#overlay button'); b && b.click(); }
});
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
cv.addEventListener('pointerdown', e => {
  if (e.pointerType === 'mouse') return;
  joy.active = true; joy.id = e.pointerId; joy.sx = e.clientX; joy.sy = e.clientY; joy.dx = joy.dy = 0;
  cv.setPointerCapture(e.pointerId);
});
cv.addEventListener('pointermove', e => {
  if (!joy.active || e.pointerId !== joy.id) return;
  joy.dx = e.clientX - joy.sx; joy.dy = e.clientY - joy.sy;
});
const endJoy = e => { if (e.pointerId === joy.id) { joy.active = false; joy.dx = joy.dy = 0; } };
cv.addEventListener('pointerup', endJoy); cv.addEventListener('pointercancel', endJoy);
$('sneakBtn').addEventListener('pointerdown', e => { e.preventDefault(); sneakToggle = !sneakToggle; $('sneakBtn').classList.toggle('on', sneakToggle); });

// ===== 更新 =====
function update(dt) {
  gameSec += dt * 6; // 現実10秒＝ゲーム内1分
  const sneaking = keys['shift'] || sneakToggle;
  let mx = 0, my = 0;
  if (keys['arrowleft'] || keys['a']) mx -= 1;
  if (keys['arrowright'] || keys['d']) mx += 1;
  if (keys['arrowup'] || keys['w']) my -= 1;
  if (keys['arrowdown'] || keys['s']) my += 1;
  if (joy.active) { const m = Math.hypot(joy.dx, joy.dy); if (m > 8) { mx = joy.dx / Math.max(m, 40); my = joy.dy / Math.max(m, 40); } }
  const ml = Math.hypot(mx, my);
  if (ml > 1) { mx /= ml; my /= ml; }
  const sp = sneaking ? 62 : 128;
  if (ml > 0.05) {
    player.face = Math.atan2(my, mx);
    const nx = player.x + mx * sp * dt, ny = player.y + my * sp * dt;
    if (!collides(nx, player.y, player.r)) player.x = nx;
    if (!collides(player.x, ny, player.r)) player.y = ny;
  }
  player.sneak = sneaking;

  // 上司
  let maxSee = 0, seer = null;
  for (const b of bosses) {
    const dx = player.x - b.x, dy = player.y - b.y, d = Math.hypot(dx, dy);
    const toP = Math.atan2(dy, dx);
    const range = b.range * (sneaking ? 0.8 : 1);
    const inCone = d < range && Math.abs(angDiff(toP, b.ang)) < b.fov / 2 && los(b.x, b.y, player.x, player.y, sneaking);
    const bump = d < 30;
    if (inCone || bump) {
      const gain = bump ? 10 : (0.55 + 1.6 * (1 - d / range)) * (sneaking ? 0.7 : 1);
      b.sus = Math.min(1, b.sus + gain * dt);
    } else b.sus = Math.max(0, b.sus - 0.35 * dt);
    if (b.sus > maxSee) { maxSee = b.sus; seer = b; }

    if (b.sus > 0.25) { // 怪しんで振り向く
      b.ang += angDiff(toP, b.ang) * Math.min(1, dt * 3);
      continue;
    }
    const n = b.path[b.wp], tx = n[0] * T + T / 2, ty = n[1] * T + T / 2;
    if (b.wait > 0) {
      b.wait -= dt; b.look += dt;
      b.ang = b.baseAng + Math.sin(b.look * 1.6) * 0.9;
      if (b.wait <= 0) b.ang = b.baseAng;
    } else {
      const ddx = tx - b.x, ddy = ty - b.y, dd = Math.hypot(ddx, ddy);
      const want = Math.atan2(ddy, ddx);
      b.ang += angDiff(want, b.ang) * Math.min(1, dt * 6);
      if (dd < 2) {
        b.x = tx; b.y = ty; b.wait = n[2]; b.look = 0;
        b.wp = (b.wp + 1) % b.path.length;
        const nn = b.path[b.wp];
        b.baseAng = Math.atan2(nn[1] * T + T/2 - ty, nn[0] * T + T/2 - tx);
      } else {
        const s = Math.min(dd, b.speed * dt);
        b.x += ddx / dd * s; b.y += ddy / dd * s;
      }
    }
  }
  meter = maxSee;
  if (meter >= 1) return caught(seer.name, pick(seer.lines));

  // ゴール判定
  const here = tile(player.x, player.y);
  const L = LEVELS[level];
  if (here === 'E') return clearLevel();
  if (here === 'L' || tile(player.x, player.y - T * 0.6) === 'L') {
    elevT += dt;
    if (elevT >= L.elevator.wait) {
      if (Math.random() < L.elevator.risk) return caught(ELEVATOR_LINE.name, ELEVATOR_LINE.line);
      return clearLevel();
    }
  } else elevT = Math.max(0, elevT - dt * 2);

  updateHud(sneaking);
}

function updateHud(sneaking) {
  $('time').textContent = fmt(gameSec);
  const L = LEVELS[level];
  let txt, col;
  if (elevT > 0 && L.elevator) { txt = 'エレベーター待ち…（上司と鉢合わせの危険）'; col = '#5dade2'; $('stFill').style.width = (elevT / L.elevator.wait * 100) + '%'; }
  else {
    txt = meter > 0.6 ? '気づかれそう！' : meter > 0.05 ? '視線を感じる…' : (sneaking ? 'しゃがみ中・未発見' : '未発見');
    col = meter > 0.6 ? '#ff5a5f' : '#e7b931';
    $('stFill').style.width = (meter * 100) + '%';
  }
  $('stText').textContent = txt; $('stFill').style.background = col;
  setMission(meter > 0.6);
}
function setMission(alert) {
  $('mission').classList.toggle('alert', alert);
  $('mTitle').textContent = '定時退社ミッション';
  $('mSub').textContent = alert ? '上司に気づかれかけている！' : '上司に見つからずに会社を出る';
}

const fmt = s => { const t = 17 * 3600 + 59 * 60 + Math.floor(s); return String(Math.floor(t / 3600)).padStart(2, '0') + ':' + String(Math.floor(t % 3600 / 60)).padStart(2, '0'); };
const pick = a => a[Math.floor(Math.random() * a.length)];

// ===== 進行 =====
function caught(name, line) {
  state = 'caught';
  caughtBy = bosses.find(b => b.name === name) || null;
  $('mission').classList.add('alert');
  $('mTitle').textContent = '定時退社ミッション';
  $('mSub').textContent = '上司に見つかった！';
  $('stText').textContent = '見つかった'; $('stFill').style.width = '100%'; $('stFill').style.background = '#ff5a5f';
  showDialog(name, line);
  setTimeout(() => showDialog('山田', '……はい。'), 2300);
  setTimeout(() => {
    $('dialog').style.display = 'none';
    const [a, b] = pick(FAIL_TEXTS);
    overlay(`<h1 class="fail">定時退社 失敗</h1><p class="big">${a}</p><p>${b}</p>
      <p style="opacity:.7">現在時刻 ${fmt(gameSec + 3600)}　残業中</p>
      <button onclick="retry()">もう一度（このフロアから）</button><button class="sub" onclick="restart()">最初から</button>`);
  }, 4200);
}
function showDialog(name, line) { $('dName').textContent = name; $('dLine').textContent = line; $('dialog').style.display = 'block'; }

function clearLevel() {
  if (level < LEVELS.length - 1) {
    state = 'clear';
    overlay(`<h1>突破！</h1><p class="big">${LEVELS[level].name} を抜けた</p><p>現在時刻 ${fmt(gameSec)}</p>
      <p>次：${LEVELS[level + 1].name}</p><button onclick="nextLevel()">次へ</button>`);
  } else {
    state = 'allclear';
    const t = fmt(gameSec), over = gameSec / 60; // 分
    const rank = over <= 4 ? ['S', '伝説の定時退社者'] : over <= 7 ? ['A', '華麗なる定時退社'] : over <= 11 ? ['B', 'ほぼ定時'] : ['C', '定時…とは'];
    overlay(`<h1>定時退社 成功！</h1><p class="big">退社時刻 ${t}</p>
      <p>ランク <b style="font-size:26px;color:#f2c94c">${rank[0]}</b>　${rank[1]}</p>
      <p style="opacity:.75">今日はもう、仕事のことは考えない。</p>
      <button onclick="restart()">もう一度遊ぶ</button>`);
  }
}
function overlay(html) { $('ovBox').innerHTML = html; $('overlay').style.display = 'flex'; }
function hideOverlay() { $('overlay').style.display = 'none'; }
window.nextLevel = () => { level++; loadLevel(level); hideOverlay(); state = 'play'; };
window.retry = () => { loadLevel(level); gameSec = levelStartSec; hideOverlay(); $('dialog').style.display = 'none'; state = 'play'; };
window.restart = () => { level = 0; gameSec = 0; levelStartSec = 0; loadLevel(0); hideOverlay(); $('dialog').style.display = 'none'; state = 'play'; };
let levelStartSec = 0;
const _next = window.nextLevel;
window.nextLevel = () => { levelStartSec = gameSec; _next(); };

// ===== 描画 =====
function draw() {
  ctx.clearRect(0, 0, W, H);
  // 床
  for (let y = 0; y < grid.length; y++) for (let x = 0; x < grid[0].length; x++) {
    const c = grid[y][x], px = x * T, py = y * T;
    ctx.fillStyle = (x + y) % 2 ? '#2b2f36' : '#2f343c';
    ctx.fillRect(px, py, T, T);
    if (c === '#') { ctx.fillStyle = '#16181c'; ctx.fillRect(px, py, T, T); ctx.fillStyle = '#1f2228'; ctx.fillRect(px, py + T - 6, T, 6); }
    if (c === 'P') { ctx.fillStyle = '#6b6457'; ctx.fillRect(px + 4, py + 4, T - 8, T - 8); ctx.fillStyle = '#857c6b'; ctx.fillRect(px + 4, py + 4, T - 8, 5); }
    if (c === 'D') {
      ctx.fillStyle = '#8a6a48'; ctx.fillRect(px + 2, py + 6, T - 4, T - 12);
      ctx.fillStyle = '#20252c'; ctx.fillRect(px + 12, py + 10, 16, 10); // モニター
      ctx.fillStyle = '#4fc3f7'; ctx.globalAlpha = .35; ctx.fillRect(px + 13, py + 11, 14, 8); ctx.globalAlpha = 1;
    }
    if (c === 'E') {
      ctx.fillStyle = '#1e6b3a'; ctx.fillRect(px, py, T, T);
      ctx.fillStyle = '#7dffa8'; ctx.font = 'bold 11px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('出口', px + T / 2, py + T / 2 + 4);
    }
    if (c === 'L') {
      ctx.fillStyle = '#5c6670'; ctx.fillRect(px + 1, py, T - 2, T);
      ctx.fillStyle = '#3d454d'; ctx.fillRect(px + T / 2 - 1, py, 2, T);
    }
  }
  // 看板
  ctx.textAlign = 'center';
  if (LEVELS[level].elevator) {
    const ex = grid[1].indexOf('L');
    ctx.fillStyle = '#cfd8dc'; ctx.font = 'bold 12px sans-serif';
    ctx.fillText('▼ エレベーター（待つ）', (ex + 1.5) * T, 2.6 * T);
    ctx.fillText('非常階段 ▶', 19.6 * T, 10.6 * T);
  }
  if (level === 0) { ctx.fillStyle = 'rgba(255,255,255,.55)'; ctx.font = 'bold 13px sans-serif'; ctx.fillText('働き方改革', 11 * T, 5.65 * T); }

  // 視界
  for (const b of bosses) {
    const range = b.range * (player.sneak ? 0.8 : 1), steps = 36;
    ctx.beginPath(); ctx.moveTo(b.x, b.y);
    for (let i = 0; i <= steps; i++) {
      const a = b.ang - b.fov / 2 + b.fov * i / steps;
      let d = 0;
      while (d < range) { d += 6; if (blocksSight(tile(b.x + Math.cos(a) * d, b.y + Math.sin(a) * d), false)) break; }
      ctx.lineTo(b.x + Math.cos(a) * d, b.y + Math.sin(a) * d);
    }
    ctx.closePath();
    const hot = b.sus > 0.05;
    ctx.fillStyle = hot ? `rgba(255,90,95,${0.18 + b.sus * 0.25})` : 'rgba(242,201,76,.16)';
    ctx.fill();
  }

  // 出口へのガイド
  // プレイヤー
  drawPerson(player.x, player.y, player.face, '#3d8bfd', player.sneak ? '山田（しゃがみ）' : '山田', player.sneak);
  // 上司
  for (const b of bosses) {
    drawPerson(b.x, b.y, b.ang, b.color, b.name, false);
    if (b.sus > 0.05 || (state === 'caught' && caughtBy === b)) {
      ctx.fillStyle = state === 'caught' && caughtBy === b ? '#ff5a5f' : '#f2c94c';
      ctx.font = 'bold 22px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(state === 'caught' && caughtBy === b ? '！' : '？', b.x, b.y - 26);
    }
  }
}
function drawPerson(x, y, a, col, label, low) {
  const r = low ? 10 : 12;
  ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.beginPath(); ctx.ellipse(x, y + 4, r + 2, r - 2, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = col; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#f1d3b3'; ctx.beginPath(); ctx.arc(x + Math.cos(a) * 5, y + Math.sin(a) * 5, 5.5, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.font = 'bold 11px sans-serif'; ctx.textAlign = 'center';
  ctx.strokeStyle = 'rgba(0,0,0,.7)'; ctx.lineWidth = 3; ctx.strokeText(label, x, y - r - 5); ctx.fillText(label, x, y - r - 5);
}

// ===== ループ =====
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (state === 'play') update(dt);
  draw();
  requestAnimationFrame(loop);
}

loadLevel(0); gameSec = 0;
overlay(`<h1>定時退社シミュレーター</h1>
  <p class="big">17:59。今日こそ、定時で帰る。</p>
  <p>上司の視界（黄色の扇形）に入ると気づかれる。<br>メーターが満タンになると「ちょっといい？」が始まる。</p>
  <p>パーティションや壁の陰に隠れよう。<b>しゃがむ</b>と遅くなるが、机の陰にも隠れられる。</p>
  <button onclick="restart()">退社する</button>
  <p class="keys">PC：WASD／矢印キーで移動・Shiftでしゃがむ ／ スマホ：画面をドラッグで移動・右下ボタンでしゃがむ</p>`);
requestAnimationFrame(loop);
</script>
