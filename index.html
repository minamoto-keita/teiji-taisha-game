<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<title>定時退社シミュレーター</title>
<style>

  .box .big { font-size: 18px; font-weight: 700; }
  .btn:disabled { opacity: .55; cursor: wait; }
  .btn { margin-top: 18px; font: inherit; font-weight: 800; font-size: 16px; padding: 11px 28px; background: #f2c94c; color: #111;
    border: 0; border-radius: 4px; cursor: pointer; }
  .btn.start { display: block; margin: 16px auto 6px; font-size: 20px; padding: 14px 56px; }
  .btn.sub { background: transparent; color: #ecebe6; border: 1px solid rgba(255,255,255,.3); margin-left: 8px; }
  .keys { font-size: 12px; opacity: .7; margin-top: 14px; }
  .cards { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; margin-top: 20px; }

  .card:hover, .card.sel { border-color: #f2c94c; transform: translateY(-3px); }

  .card .nm { font-size: 20px; font-weight: 900; margin-top: 10px; } .card .dp { font-size: 12px; opacity: .7; }
  .card .st { font-size: 12px; margin-top: 8px; line-height: 1.8; } .card .st b { color: #f2c94c; letter-spacing: 2px; }
  .diffs { margin-top: 22px; } .dlab { font-size: 12px; opacity: .7; letter-spacing: .1em; }
  .drow { display: flex; gap: 10px; justify-content: center; margin-top: 8px; }
  .diff { font: inherit; font-weight: 800; font-size: 15px; padding: 9px 22px; border-radius: 4px; cursor: pointer;
    background: transparent; color: #ecebe6; border: 1.5px solid rgba(255,255,255,.3); }
  .diff.sel { background: #f2c94c; color: #111; border-color: #f2c94c; }
  .ddesc { font-size: 13px; opacity: .85; margin-top: 10px; min-height: 1.6em; }
  .card .ds { font-size: 12px; opacity: .8; margin-top: 6px; line-height: 1.6; }

    #touch { display: block; }

  .tbtn { position: fixed; z-index: 6; width: 72px; height: 72px; border-radius: 50%; background: rgba(242,201,76,.18);

  .tbtn.on { background: rgba(242,201,76,.6); color: #111; }
  #tSneak { right: 20px; bottom: 120px; } #tAct { right: 104px; bottom: 76px; display: none; } #tDash { right: 20px; bottom: 200px; } #tCall { right: 104px; bottom: 160px; }
  #items { position: fixed; left: 14px; top: 128px; color: #fff; padding: 10px 12px; min-width: 210px; }
  #items .ch { font-size: 11px; color: #f2c94c; letter-spacing: .12em; font-weight: 800; margin-bottom: 6px; }
  #items .row { display: flex; align-items: center; gap: 10px; padding: 4px 6px; margin: 0 -6px; border-radius: 4px; font-size: 14px; font-weight: 700; transition: background .15s; }
  #items .row.on { background: rgba(242,201,76,.45); box-shadow: inset 3px 0 0 #f2c94c; }
  #items .row.off { opacity: .4; }
  #items .k { min-width: 64px; display: flex; gap: 3px; }
  #items .note { font-size: 11px; font-weight: 600; opacity: .75; margin-left: auto; }
  #items .lock { margin-top: 8px; font-size: 12px; font-weight: 700; color: #111; background: #f2c94c; border-radius: 4px; padding: 5px 8px; text-align: center; }

    background: #ecebe6; border-radius: 5px; box-shadow: 0 3px 0 #8e8c86; }
  kbd.w { min-width: 54px; }
  .ctrlgrid { display: grid; grid-template-columns: repeat(3, minmax(170px, 1fr)); gap: 10px; margin: 18px auto 0; max-width: 640px; text-align: left; }
  .ctrlgrid div { background: #171b21; border: 1px solid rgba(255,255,255,.12); border-radius: 8px; padding: 10px 12px; font-size: 14px; font-weight: 700; }
  .ctrlgrid div span { display: block; font-size: 11px; font-weight: 600; opacity: .7; margin-top: 6px; }
  .ctrlgrid div.hl { border-color: rgba(242,201,76,.7); }

  .ctrlttl { font-size: 13px; color: #f2c94c; letter-spacing: .12em; font-weight: 800; margin-top: 22px; }
  @media (max-width: 640px) { .ctrlgrid { grid-template-columns: 1fr 1fr; } }
  .who { display: flex; gap: 14px; align-items: center; justify-content: center; margin-top: 14px; text-align: left; }
  .face.sm { width: 64px; height: 64px; border-radius: 6px; object-fit: cover; }
  .who .nm { font-size: 20px; font-weight: 900; } .who .dp { font-size: 12px; opacity: .85; margin-top: 4px; } .who b { color: #f2c94c; letter-spacing: 1px; }
  .scards { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 8px; }
  .scard { width: 250px; text-align: left; padding: 14px 16px; border-radius: 8px; cursor: pointer; background: #171b21; border: 2px solid rgba(255,255,255,.1); transition: border-color .12s, transform .12s; }
  .scard:hover, .scard.sel { border-color: #f2c94c; transform: translateY(-2px); }
  .scard .sfl { font-size: 11px; color: #f2c94c; letter-spacing: .1em; } .scard .snm { font-size: 19px; font-weight: 900; margin-top: 2px; } .scard .sds { font-size: 12px; opacity: .8; margin-top: 6px; line-height: 1.6; }
  .qual { font: inherit; font-weight: 700; font-size: 13px; padding: 6px 16px; border-radius: 4px; cursor: pointer; background: transparent; color: #ecebe6; border: 1.5px solid rgba(255,255,255,.3); }
  .qual.sel { background: #ecebe6; color: #111; }
  kbd { white-space: nowrap; }
  .tbtn { background: rgba(14,17,22,.6) !important; }
  @media (pointer: coarse) { #items { min-width: 0; padding: 6px 12px; } }
  .tbtn.on { background: rgba(242,201,76,.75) !important; }
  @media (max-width: 600px) {
    #overlay { padding: 10px; }
    .box { padding: 22px 16px; }
    .box h1 { font-size: 24px; }
    .box p { font-size: 13px; }
    .box .big { font-size: 16px; }
    .ctrlgrid { gap: 8px; }
    .ctrlgrid div { padding: 9px 10px; }
    .scard { width: 100%; }
    .who .dp { line-height: 1.7; }
    .diff { padding: 9px 14px; white-space: nowrap; }
    #mission { min-width: 0; max-width: calc(100vw - 150px); padding: 8px 10px; gap: 8px; }
    #mission canvas { width: 32px; height: 32px; }
    #mission .title { font-size: 14px; } #mission .who { font-size: 11px; } #mission .sub { display: none; }
    #clock { min-width: 0; max-width: 118px; padding: 8px 10px; }
    #clock .t { font-size: 22px; } #clock .loc, #clock .goal { font-size: 10px; }
    #items { top: 92px; }
    #hint { left: 14px; right: auto; bottom: 200px; font-size: 12px; max-width: calc(100vw - 120px); }
  }
  @media (max-height: 500px) {
    #mission { padding: 6px 10px; } #mission .sub { display: none; }
    #clock { padding: 6px 10px; } #clock .t { font-size: 22px; }
    #items { top: 102px; padding: 5px 10px; }
    #minimap { width: 110px; height: 110px; } #meter { left: 120px; }
    .tbtn { width: 62px; height: 62px; }
    #tSneak { bottom: 90px; } #tDash { bottom: 160px; } #tCall { right: 90px; bottom: 125px; } #tAct { right: 160px; bottom: 30px; }
  }
  @media (pointer: coarse) and (max-height: 500px) {
    #hint { top: 46px; bottom: auto; left: 50%; right: auto; transform: translateX(-50%); max-width: 46vw; font-size: 12px; padding: 6px 10px; }
  }
  #rotate { display: none; position: fixed; inset: 0; z-index: 100; background: #0b0d11; color: #ecebe6; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px; }
  #rotate .ph { font-size: 64px; animation: rot 2s ease-in-out infinite; }
  #rotate .rt { font-size: 20px; font-weight: 800; margin-top: 18px; } #rotate .rt b { color: #f2c94c; }
  #rotate .rs { font-size: 13px; opacity: .7; margin-top: 8px; }
  @keyframes rot { 0%, 30% { transform: rotate(0); } 60%, 100% { transform: rotate(-90deg); } }
  @media (pointer: coarse) and (orientation: portrait) { #rotate { display: flex; } }
  @media (max-height: 500px) {
    #overlay { padding: 8px; }
    .box { padding: 14px 22px; max-width: 98vw; }
    .box h1 { font-size: 22px; }
    .box p { font-size: 12px; margin-top: 4px; line-height: 1.55; }
    .box .big { font-size: 15px; }
    .btn { margin-top: 10px; padding: 8px 24px; font-size: 15px; }
    .ctrlttl { margin-top: 10px; font-size: 12px; }
    .ctrlgrid { grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 6px; max-width: 720px; }
    .ctrlgrid div { padding: 6px 9px; font-size: 13px; }
    .ctrlgrid div span { margin-top: 3px; }
    kbd { padding: 2px 6px; font-size: 12px; }
    .who { margin-top: 6px; } .face.sm { width: 44px; height: 44px; } .who .nm { font-size: 16px; }
    .dlab { font-size: 11px; }
    .scards { flex-wrap: nowrap; gap: 8px; margin-top: 4px; }
    .scard { width: auto; flex: 1; padding: 8px 10px; }
    .scard .snm { font-size: 15px; } .scard .sds { font-size: 11px; line-height: 1.45; margin-top: 3px; }
    .diffs { margin-top: 8px; } .drow { margin-top: 4px; }
    .diff { padding: 6px 16px; font-size: 13px; } .qual { padding: 4px 12px; font-size: 12px; }
    .ddesc { margin-top: 4px; font-size: 12px; }
    .ctrlrow { margin-top: 4px; font-size: 12px; gap: 6px 12px; }
    .scard .sds { display: none; }
    .diffs { display: inline-block; vertical-align: top; margin: 8px 12px 0; }
    .ddesc { display: none; }
  }
  #bPause { position: fixed; z-index: 7; top: 14px; left: 50%; transform: translateX(-50%); font: inherit; font-weight: 800; font-size: 14px;
    padding: 8px 16px; border-radius: 6px; background: rgba(14,17,22,.82); color: #ecebe6; border: 1px solid rgba(255,255,255,.2); cursor: pointer; }
  #bPause:hover { border-color: #f2c94c; color: #f2c94c; }
  .pmenu { display: flex; flex-direction: column; gap: 10px; align-items: center; margin-top: 16px; }
  .pmenu .btn { margin: 0; width: 280px; } .pmenu .btn.sub { margin: 0; }
  @media (max-height: 500px) { #bPause { top: 8px; padding: 6px 12px; font-size: 13px; } .pmenu { gap: 6px; margin-top: 8px; } .pmenu .btn { padding: 7px 20px; } }
  #bMute { position: fixed; z-index: 30; top: 14px; right: 14px; font: inherit; font-size: 16px; font-weight: 800; padding: 6px 12px;
    border-radius: 6px; background: rgba(14,17,22,.82); color: #ecebe6; border: 1px solid rgba(255,255,255,.2); cursor: pointer; }
  body.playing #bMute { top: 14px; right: auto; left: calc(50% + 86px); }
  @media (max-height: 500px) { body.playing #bMute { top: 8px; left: calc(50% + 74px); padding: 5px 10px; } }
  @media (pointer: coarse) { #overlay { padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 90px); padding-left: max(8px, env(safe-area-inset-left)); padding-right: max(8px, env(safe-area-inset-right)); }
    .btn.start { margin: 10px auto 4px; font-size: 18px; padding: 12px 48px; } }
</style>

<body>
<canvas id="view"></canvas>
<div id="vignette" class="hud"></div>
<div id="mission" class="hud panel">
  <canvas id="mFace" width="80" height="80"></canvas>
  <div><div class="who" id="mWho">—</div><div class="title" id="mTitle">定時退社ミッション</div><div class="sub" id="mSub">上司に見つからずに会社を出る</div></div>
</div>
<div id="clock" class="hud panel"><div class="t" id="time">17:59</div><div class="loc" id="loc">本社・営業フロア</div><div class="goal" id="goal">目標：会社の外へ</div></div>
<div id="mapWrap" class="hud"><div id="stLabel">未発見</div><canvas id="minimap" width="300" height="300"></canvas><div id="meter"><div id="meterFill"></div></div></div>
<div id="hint" class="hud panel"><div class="chk"></div><span id="hintText">会社の外へ</span></div>
<div id="dialog" class="hud panel"><div class="name" id="dName"></div><div class="line" id="dLine"></div></div>
<div id="progress" class="hud panel"><div id="pText">エレベーター待ち…</div><div class="bar"><div class="fill" id="pFill"></div></div></div>
<div id="touch"><button class="tbtn" id="tSneak">しゃがむ</button><button class="tbtn" id="tAct">調べる</button><button class="tbtn" id="tDash">ダッシュ</button><button class="tbtn" id="tCall">電話</button></div>
<div id="items" class="hud panel" style="display:none"></div>
<button id="bPause" style="display:none" aria-label="一時停止">⏸ 一時停止</button>
<button id="bMute" aria-label="音のオンオフ">🔊</button>
<div id="toast" style="position:fixed;left:50%;top:22%;transform:translateX(-50%);font:700 18px sans-serif;color:#fff;background:rgba(20,24,30,.8);padding:8px 16px;border-radius:8px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:20"></div>
<div id="overlay"><div class="box" id="ovBox"></div></div>
<div id="rotate"><div class="ph">📱</div><div class="rt">スマホを<b>横向き</b>にして遊んでください</div><div class="rs">縦向きのあいだはゲームが止まります</div></div>

<script src="faces.js"></script>
<script src="model.js"></script>
<script src="npc.js"></script>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/" } }</script>
<script type="module">

import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import * as SkeletonUtils from 'three/addons/utils/SkeletonUtils.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { GTAOPass } from 'three/addons/postprocessing/GTAOPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

// ================== 設定（名前やステータスはここで変える） ==================
const PHOTOS = window.PHOTOS || {};
const CHARACTERS = [
  { id: 'c', name: 'まさみさん', dept: '営業部', photo: 'c', glb: true, style: 'long', hair: '#3a2418', shirt: '#efe6c8', pants: '#1f2a44',
    speed: 1.05, stealth: 1.15, desc: '腰に手を当てた余裕の構えで、堂々と定時を狙う。', stars: [3, 4] },
];
const BOSS_LINES = {
  '係長': ['あ、ちょっといいですか？明日の資料なんですけど。', 'もう帰るんですか？例の件、少しだけ相談させてください。'],
  '課長': ['あとでちょっといい？', '帰る前にさ、5分だけいいかな。'],
  '部長': ['この資料だけ見てくれる？5分で終わるから。', 'お、ちょうどいいところに。'],
  '次長': ['（タバコを消しながら）……君、ちょっと話そうか。', 'お疲れ。ところで来週の件だが。'],
  '主任': ['あ、ちょうどよかった！この見積もり見てもらえます？', '今日って何時まで残れます？'],
  '本部長': ['（扉が開くと、本部長が乗っていた）おお、ちょうど話があったんだ。'],
  '専務': ['君、営業の子だね。ちょっと役員会の資料を手伝ってくれないか。', 'ちょうどいい。少し話を聞かせてくれ。'],
  '常務': ['（ガラス越しに手招きされた）……ちょっと入ってくれる？', 'あ、君！この会議に出てくれないか。'],
  '秘書': ['あ、お疲れ様です。専務がお呼びです。', 'すみません、社長が少しお話があると。'],
  '社長': ['君、ちょっといいかね。', '若い人の意見を聞きたくてね。少し時間あるかな。'],
  '室長': ['ちょうどいい、この資料の数字を確認してほしいんだ。'],
  '警備員': ['お疲れ様です。……あ、部長が探してましたよ。呼びますね。', '入館証の確認を……あれ、部長がお呼びです。'],
};
const FAIL_TEXTS = [
  ['「5分だけ」から1時間経過', '追加クエスト：終わらない残業'],
  ['「ちょっとだけ」が会議になった', '追加クエスト：議事録作成'],
  ['気づけば終電の時間', '追加クエスト：明日の資料'],
];

// ================== レンダラー・ポストエフェクト ==================
const view = document.getElementById('view');
const renderer = new THREE.WebGLRenderer({ canvas: view, antialias: true, powerPreference: 'high-performance' });
renderer.shadowMap.enabled = !matchMedia('(pointer: coarse)').matches;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
const scene = new THREE.Scene();
scene.background = new THREE.Color('#1c1d21');
const camera = new THREE.PerspectiveCamera(60, 1, 0.05, 160);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.45;

let quality = localStorage.getItem('teiji-quality') || 'high';
let composer = null, gtao = null;
function setupComposer() {

  for (const b of OBST) { const cx = clamp(x, b.x0, b.x1), cz = clamp(z, b.z0, b.z1); if ((x - cx) ** 2 + (z - cz) ** 2 < r * r) return true; }

}
function resolveCollision(p, r) {
  for (let k = 0; k < 2; k++) for (const b of OBST) {
    const cx = clamp(p.x, b.x0, b.x1), cz = clamp(p.z, b.z0, b.z1);
    const dx = p.x - cx, dz = p.z - cz, d2 = dx * dx + dz * dz;
    if (d2 < r * r) {
      if (d2 > 1e-8) { const d = Math.sqrt(d2); p.x += dx / d * (r - d); p.z += dz / d * (r - d); }
      else {
        const opts = [[b.x0 - r - p.x, 0], [b.x1 + r - p.x, 0], [0, b.z0 - r - p.z], [0, b.z1 + r - p.z]];
        opts.sort((u, v) => Math.abs(u[0] + u[1]) - Math.abs(v[0] + v[1])); p.x += opts[0][0]; p.z += opts[0][1];

}

const GEO = {};

  constructor() { this.map = new Map(); }
  part(key, geoFn, mat, B, lx, ly, lz, rx = 0, ry = 0, rz = 0, sx = 1, sy = 1, sz = 1, cast = true) {
    const k = key + '|' + mat.uuid; let e = this.map.get(k);
    if (!e) { e = { g: geo(key, geoFn), mat, list: [], cast }; this.map.set(k, e); }
    const L = new THREE.Matrix4().compose(new THREE.Vector3(lx, ly, lz), new THREE.Quaternion().setFromEuler(new THREE.Euler(rx, ry, rz)), new THREE.Vector3(sx, sy, sz));
    e.list.push(B ? B.clone().multiply(L) : L);
  }
  flush() {
    for (const e of this.map.values()) {

}

// 壁（x方向に伸びる壁。z0〜z1が厚み）。cuts: [{a,b,top,pass}] は開口部
function wallX(x0, x1, z0, z1, H, mat, cuts = []) {
  let x = x0; cuts = [...cuts].sort((p, q) => p.a - q.a);
  for (const c of cuts) {
    if (c.a > x) { slab(x, z0, c.a, z1, 0, H, mat); box(x, z0, c.a, z1, H, 'wall'); }
    slab(c.a, z0, c.b, z1, c.top, H, mat);
    if (!c.pass) box(c.a, z0, c.b, z1, H, 'wall');
    x = c.b;
  }
  if (x < x1) { slab(x, z0, x1, z1, 0, H, mat); box(x, z0, x1, z1, H, 'wall'); }
  baseboardX(x0, x1, z0, z1, cuts);
}
function wallZ(z0, z1, x0, x1, H, mat, cuts = []) {
  let z = z0; cuts = [...cuts].sort((p, q) => p.a - q.a);
  for (const c of cuts) {
    if (c.a > z) { slab(x0, z, x1, c.a, 0, H, mat); box(x0, z, x1, c.a, H, 'wall'); }
    slab(x0, c.a, x1, c.b, c.top, H, mat);
    if (!c.pass) box(x0, c.a, x1, c.b, H, 'wall');
    z = c.b;
  }
  if (z < z1) { slab(x0, z, x1, z1, 0, H, mat); box(x0, z, x1, z1, H, 'wall'); }
}
function baseboardX(x0, x1, z0, z1, cuts) {
  let x = x0; for (const c of cuts) { if (c.a > x) { slab(x, z0 - 0.012, c.a, z1 + 0.012, 0, 0.08, MAT.base, false); } x = c.b; }
  if (x < x1) slab(x, z0 - 0.012, x1, z1 + 0.012, 0, 0.08, MAT.base, false);
}

  const g = mesh(new THREE.PlaneGeometry(x1 - x0, top - sill), MAT.glass, (x0 + x1) / 2, (sill + top) / 2, zw - 0.15, 0, false); g.renderOrder = 3;
  for (let x = x0; x <= x1 + 0.01; x += 1.8) KIT.part('mull', B_(0.06, top - sill, 0.12), MAT.alu, null, Math.min(x, x1 - 0.03), (sill + top) / 2, zw - 0.15);
  KIT.part('mullh', B_(1, 0.06, 0.12), MAT.alu, null, (x0 + x1) / 2, sill + 0.03, zw - 0.15, 0, 0, 0, x1 - x0, 1, 1);

    const c = player.inBox; c.x = player.x; c.z = player.z; c.g.position.set(player.x, 0, player.z);
    c.g.rotation.y = Math.PI / 2 - player.face; c.g.children[0].position.y = 0.39 + (player.speed > 0 ? Math.abs(Math.sin(performance.now() / 110)) * 0.03 : 0);
  }
  player.dashing = dash && player.speed > 0.5;
  if (player.speed > 0.1) {
    stepDist += player.speed * dt;
    const stride = inBox ? 0.45 : player.dashing ? 0.85 : crouch ? 0.5 : 0.62;
    if (stepDist > stride) { stepDist = 0; SND.step(inBox ? 'box' : player.dashing ? 'dash' : crouch ? 'crouch' : 'walk'); }
  }
  if (crouch !== prevCrouch && !inBox) SND.rustle(); prevCrouch = crouch;
  updateNoise(dt);
  updateCoworkers(dt, crouch);

  let maxSus = 0, seer = null;
  for (const b of bosses) {
    const dx = player.x - b.x, dz = player.z - b.z, d = Math.hypot(dx, dz), toP = Math.atan2(dz, dx);
    const range = b.range * (crouch ? 0.75 : 1);
    const onPhone = b.phone > 0;
    if (onPhone) { b.phone -= dt; if (b.ring > 0) b.ring -= dt; }
    const inCone = !onPhone && d < range && Math.abs(angDiff(toP, b.ang)) < b.fov / 2 && lineOfSight(b.x, b.z, player.x, player.z, crouch);
    if (player.dashing && d < NOISE_R && !onPhone) b.sus = Math.min(0.95, b.sus + 1.5 * D().gain * dt);
    const boxStill = inBox && player.speed < 0.1;
    const bump = (inBox ? !boxStill && d < 0.7 : d < 1.0) && lineOfSight(b.x, b.z, player.x, player.z, false);
    const boxSeen = inCone && (!inBox || (!boxStill && d < range * 0.6));
    if (bump || boxSeen) b.sus = Math.min(1, b.sus + (bump ? 8 : (0.5 + 1.5 * (1 - d / range)) * (inBox ? 0.25 : crouch ? 0.7 : 1) / chara.stealth * D().gain) * dt);
    else b.sus = Math.max(0, b.sus - D().decay * dt);
    if (b.sus > maxSus) { maxSus = b.sus; seer = b; }
    let moving = 0;
    if (onPhone) { b.ang += angDiff(b.phoneAng, b.ang) * Math.min(1, dt * 4); b.sus = Math.max(0, b.sus - 0.6 * dt); }
    else if (b.lookAt && b.lookAt.t > 0) { b.lookAt.t -= dt; b.ang += angDiff(Math.atan2(b.lookAt.z - b.z, b.lookAt.x - b.x), b.ang) * Math.min(1, dt * 4); }
    else if (b.sus > 0.25) b.ang += angDiff(toP, b.ang) * Math.min(1, dt * 3);
    else if (b.sweep) { b.look += dt; b.ang = b.sweep.center + Math.sin(b.look * b.sweep.speed) * b.sweep.amp; }
    else {
      const n = b.path[b.wp];
      if (b.wait > 0) { b.wait -= dt; b.look += dt; b.ang = b.baseAng + Math.sin(b.look * 1.4) * 0.85; }
      else {
        const ddx = n[0] - b.x, ddz = n[1] - b.z, dd = Math.hypot(ddx, ddz);

        } else { const s = Math.min(dd, b.speed * dt); b.x += ddx / dd * s; b.z += ddz / dd * s; moving = b.speed; }
      }

  SND.setTension(meter);
  if (meter > 0.05 && prevMeter <= 0.05) SND.notice();
  prevMeter = meter;
  if (meter > 0.3) { heartT -= dt; if (heartT <= 0) { heartT = 1.0 - meter * 0.55; SND.heart(Math.min(1, meter)); } } else heartT = 0;
  if (meter >= 1) return caught(seer, pick(BOSS_LINES[seer.name] || BOSS_LINES['課長']));

  const ex = exitAt(player.x, player.z);

  if (elevWait >= 0) {
    if (!ex || ex.type !== 'elev') { elevWait = -1; }
    else {
      if (Math.floor((elevWait + dt) * 2) > Math.floor(elevWait * 2)) SND.tick();

      $('progress').style.display = 'block'; $('pText').textContent = 'エレベーター待ち…（中に上司がいるかも）';
      $('pFill').style.width = Math.min(100, elevWait / 4 * 100) + '%';

        elevTarget.opening = true; SND.ding();
        const ix = elevTarget.x - Math.sin(elevTarget.ry) * 0.9, iz = elevTarget.z - Math.cos(elevTarget.ry) * 0.9;
        if (Math.random() < D().elevRisk) {

        }
        exitTarget = [ix, iz];
        elevWait = -1; $('progress').style.display = 'none';
        return escape('エレベーターで脱出', 0.9);
      }
    }

}

const NOISE_R = 7;
let phones = 2, noiseRings = [], noiseT = 0, graceT = 0;
function updateNoise(dt) {
  noiseT -= dt;
  if (player.dashing && noiseT <= 0) {
    noiseT = 0.32;
    const m = new THREE.Mesh(new THREE.RingGeometry(0.9, 1, 48), new THREE.MeshBasicMaterial({ color: '#ffd166', transparent: true, opacity: 0.5, depthWrite: false, side: THREE.DoubleSide, toneMapped: false }));

  }

}
function usePhone() {

  let t = null, best = -1;
  for (const b of bosses) { if (b.phone > 0) continue; const d = Math.hypot(player.x - b.x, player.z - b.z); const score = b.sus * 100 + Math.max(0, 30 - d); if (d < 25 && score > best) { best = score; t = b; } }

}

const fmt = s => { const t = 17 * 3600 + 59 * 60 + Math.floor(s); return String(Math.floor(t / 3600)).padStart(2, '0') + ':' + String(Math.floor(t % 3600 / 60)).padStart(2, '0'); };

const camPos = new THREE.Vector3(), camLook = new THREE.Vector3();
let camSnap = true;
function updateCamera(dt) {

    pl.root.position.set(player.x, 0, player.z); pl.root.rotation.y = Math.PI / 2 - player.face; animatePerson(pl, dt, d > 0.05 ? 1.8 : 0, false);
  }

}

// ================== 検証（開発用） ==================
window.__validate = () => {
  const out = [];
  STAGES.forEach((S, i) => {
    buildStage(i);
    const st = STAGE.start; const rep = { stage: S.id, startOK: !hitsAny(st.x, st.z, 0.3), bossProblems: [], exits: [] };
    for (const b of S.bosses) {
      for (let k = 0; k < b.path.length; k++) {
        const p = b.path[k], n = b.path[(k + 1) % b.path.length];
        const L = Math.hypot(n[0] - p[0], n[1] - p[1]), steps = Math.max(1, Math.ceil(L / 0.2));
        for (let t = 0; t <= steps; t++) { const x = p[0] + (n[0] - p[0]) * t / steps, z = p[1] + (n[1] - p[1]) * t / steps;
          if (b.pose !== 'sit' && hitsAny(x, z, 0.25)) { rep.bossProblems.push(`${b.name} @(${x.toFixed(1)},${z.toFixed(1)})`); break; } }
      }
    }
    const cs = 0.25, nx = Math.ceil(S.W / cs), nz = Math.ceil(S.D / cs), seen = new Uint8Array(nx * nz), q = [];
    const free = (i, j) => !hitsAny(i * cs + cs / 2, j * cs + cs / 2, 0.3);
    const si = Math.floor(st.x / cs), sj = Math.floor(st.z / cs); seen[sj * nx + si] = 1; q.push([si, sj]);
    while (q.length) { const [a, c] = q.pop(); for (const [da, dc] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) { const a2 = a + da, c2 = c + dc; if (a2 < 0 || c2 < 0 || a2 >= nx || c2 >= nz) continue; const k = c2 * nx + a2; if (seen[k]) continue; if (!free(a2, c2)) { seen[k] = 2; continue; } seen[k] = 1; q.push([a2, c2]); } }
    for (const e of STAGE.exits) { let ok = false; for (let j = 0; j < nz && !ok; j++) for (let ii = 0; ii < nx; ii++) { const x = ii * cs + cs / 2, z = j * cs + cs / 2; if (seen[j * nx + ii] === 1 && inZone(e.zone, x, z)) { ok = true; break; } } rep.exits.push(e.type + ':' + ok); }
    out.push(rep);
  });
  buildStage(0);
  return out;
};
window.__setYaw = v => { yaw = v; camSnap = true; };
window.__game = { get state() { return state; }, get player() { return player; }, get bosses() { return bosses; }, startGame, CHARACTERS, keys, doAction, get meter() { return meter; }, buildStage, get stage() { return STAGE; }, hitsAny, pauseGame, resumeGame, usePhone, get cardboards() { return cardboards; }, get pl() { return pl; }, SND };

buildStage(0);
